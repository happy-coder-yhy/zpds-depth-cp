name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: zpds-depth-cp --help
      - name: Round-trip S1 depth
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import numpy as np
          from zpds_depth_cp import compress, decompress, verify
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              raw = np.linspace(0.01, 12, 4096, dtype='f4').reshape(1, 64, 64)
              np.save(root / 'raw.npy', raw)
              compress(root / 'raw.npy', root / 'depth.zarr')
              assert verify(root / 'raw.npy', root / 'depth.zarr')['passed']
              decompress(root / 'depth.zarr', root / 'decoded.npy')
              assert np.load(root / 'decoded.npy').shape == raw.shape
          PY
