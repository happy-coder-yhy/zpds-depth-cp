name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - run: zpds-depth-cp --help
      - name: Round-trip S1, S2 and S3 depth
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import numpy as np
          from zpds_depth_cp import compress, decompress, verify
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              raw = np.linspace(0.01, 12, 4096, dtype='f4').reshape(1, 64, 64)
              np.save(root / 'raw.npy', raw)
              for preset in ('S1', 'S2', 'S3'):
                  target = root / f'{preset}.zarr'
                  compress(root / 'raw.npy', target, preset=preset)
                  result = verify(root / 'raw.npy', target)
                  assert result['passed'] and result['preset'] == preset
                  decompress(target, root / f'{preset}.npy')
                  assert np.load(root / f'{preset}.npy').shape == raw.shape
          PY
